[package]
name = "simpleedit-tasks"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Tasks plugin of SimpleEdit"
license = "MIT"

[[bin]]
name = "tasks"
path = "src/main.rs"

[dependencies]
simpleedit-plugin = { git = "https://github.com/simple-edit-app/plugin-sdk", tag = "v0.4.2" }
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
