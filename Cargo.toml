[package]
name = "ardoise-tasks"
version = "1.0.2"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Tasks plugin of Ardoise"
license = "MIT"

[[bin]]
name = "tasks"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.12.0" }
serde_json = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
